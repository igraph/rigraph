# Build every commit on a branch that has no rcc verdict yet, one shard of commits per job.
# The scripts are served by cynkra/cynkratemplate's each-plan, each-shard and each-follow-up actions;
# see .github/actions/each-shard/README.md there.
#
# On a series branch (`<S>-dev` with a sibling `<S>-green`), only commits in `<S>-green..HEAD` are considered;
# nothing is built when green is not an ancestor of HEAD.
# On branches without a green sibling, the first-parent history since `since` is scanned.
# Either way, a commit is built only if it is undecided, oldest first, and gets a verdict of its own.
#
# See handbook/operations/ci/per-commit/README.md for the design.

on:
  push:
    branches:
      - each-*
      - "*-dev"
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest commit date to consider (ISO 8601)"
        type: string
        default: ""
      shard-budget-minutes:
        description: "Build-time target per shard, excluding setup; the GitHub job limit is 360"
        type: string
        default: ""
      max-parallel:
        description: "Shards to build concurrently"
        type: string
        default: ""
      split-factor:
        description: "Runner minutes the plan may cost, relative to the fewest-shards plan, to shorten wall clock (1.0 = never rebalance)"
        type: string
        default: ""
      max-commits:
        description: "Cap on commits considered (0 = no cap), newest kept"
        type: string
        default: ""
      force:
        description: "Rebuild commits that already have a verdict"
        type: boolean
        default: false
      follow-up-of:
        description: "The run this one follows up, set by that run"
        type: string
        default: ""
      follow-up-head:
        description: "The commit that run planned from; a retry tip equal to it is not replanned"
        type: string
        default: ""
  workflow_call:
    inputs:
      branch:
        description: "Branch ref to build (e.g. refs/heads/main-dev)"
        required: true
        type: string
      since:
        description: "Earliest commit date to consider (ISO 8601)"
        required: false
        type: string
        default: ""
      shard-budget-minutes:
        description: "Build-time target per shard, excluding setup"
        required: false
        type: string
        default: ""
      max-parallel:
        description: "Shards to build concurrently"
        required: false
        type: string
        default: ""
      split-factor:
        description: "Runner minutes the plan may cost, relative to the fewest-shards plan, to shorten wall clock"
        required: false
        type: string
        default: ""
      max-commits:
        description: "Cap on commits considered (0 = no cap), newest kept"
        required: false
        type: string
        default: ""

name: each-rcc

# One planning and building pass per branch at a time.
# `cancel-in-progress: false` on purpose: a queued run must wait for a long build rather than kill it,
# because a killed leg leaves its in-flight commit undecided.
# The follow-up waits in this group too, until the run that dispatched it completes.
concurrency:
  group: each-rcc-${{ inputs.branch || github.ref }}
  cancel-in-progress: false

env:
  EACH_SHARD_BUDGET_MINUTES: ${{ inputs.shard-budget-minutes || '300' }}

jobs:
  plan:
    # Per-commit checks run in the fork that lands the series, not upstream.
    if: github.repository == 'krlmlr/rigraph'
    runs-on: ubuntu-26.04

    timeout-minutes: 15

    name: "Plan per-commit rcc builds"

    outputs:
      # The fallbacks cover a planning step that did not run at all:
      # `build` is guarded by `shards != '0'`, but its `strategy` must still parse.
      matrix: ${{ steps.plan.outputs.matrix || '{"shard":["none"]}' }}
      shards: ${{ steps.plan.outputs.shards || '0' }}
      max_parallel: ${{ steps.plan.outputs.max_parallel || '1' }}

    permissions:
      contents: read

    steps:
      # The plan has no defaults for the scan start and the cost model, so a missing variable fails here, by its name.
      - name: Check the repository variables the plan needs
        env:
          INPUT_SINCE: ${{ inputs.since }}
          EACH_RCC_SINCE: ${{ vars.EACH_RCC_SINCE }}
          EACH_RCC_SETUP_MINUTES: ${{ vars.EACH_RCC_SETUP_MINUTES }}
          EACH_RCC_FULL_BUILD_MINUTES: ${{ vars.EACH_RCC_FULL_BUILD_MINUTES }}
          EACH_RCC_FLOOR_MINUTES: ${{ vars.EACH_RCC_FLOOR_MINUTES }}
          EACH_RCC_OBJECT_SECONDS: ${{ vars.EACH_RCC_OBJECT_SECONDS }}
        run: |
          required="EACH_RCC_SETUP_MINUTES EACH_RCC_FULL_BUILD_MINUTES EACH_RCC_FLOOR_MINUTES EACH_RCC_OBJECT_SECONDS"
          if [ -z "${INPUT_SINCE}" ]; then
            required="EACH_RCC_SINCE ${required}"
          fi
          missing=""
          for var in ${required}; do
            [ -n "${!var}" ] || missing="${missing} ${var}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Repository variables not set:${missing}. Set them under Settings, Secrets and variables, Actions, Variables."
            exit 1
          fi
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - id: plan
        uses: cynkra/cynkratemplate/.github/actions/each-plan@claude/each-actions
        with:
          since: ${{ inputs.since || vars.EACH_RCC_SINCE }}
          shard-budget-minutes: ${{ env.EACH_SHARD_BUDGET_MINUTES }}
          max-parallel: ${{ inputs.max-parallel || vars.EACH_RCC_MAX_PARALLEL || '20' }}
          max-commits: ${{ inputs.max-commits }}
          split-factor: ${{ inputs.split-factor || vars.EACH_RCC_SPLIT_FACTOR }}
          force: ${{ inputs.force || false }}
          follow-up-of: ${{ inputs.follow-up-of }}
          follow-up-head: ${{ inputs.follow-up-head }}
          # rigraph's cost model, fitted to its own legs; every commit weighs the same (scripts/each-cost.py).
          setup-minutes: ${{ vars.EACH_RCC_SETUP_MINUTES }}
          full-build-minutes: ${{ vars.EACH_RCC_FULL_BUILD_MINUTES }}
          floor-minutes: ${{ vars.EACH_RCC_FLOOR_MINUTES }}
          object-seconds: ${{ vars.EACH_RCC_OBJECT_SECONDS }}

  build:
    needs:
      - plan

    if: needs.plan.outputs.shards != '0'

    runs-on: ubuntu-26.04

    # Below GitHub's 6 h ceiling, and above the leg's own deadline:
    # the leg stops itself and reports what it deferred, rather than being killed mid-commit.
    timeout-minutes: 350

    name: "shard ${{ matrix.shard }} (${{ matrix.label }})"

    permissions:
      # `write` for the store on the `rcc2` branch, and for the snapshot-<sha>-rcc-smoke-null branches
      # the snapshots gate publishes off the commit under test.
      contents: write
      statuses: write
      actions: read

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: cynkra/cynkratemplate/.github/actions/git-identity@main

      - uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-version: each-rcc-1
          needs: build, check, website, roxygen2
          extra-packages: any::rcmdcheck r-lib/roxygen2 any::decor r-lib/pkgdown deps::.

      # Deliberately not custom/after-install.
      # Its argument-migration drift check is about the content of a commit,
      # so on the tip checkout it would judge the wrong one,
      # and a drift there would fail the leg before it judged any.
      # The `regen` gate of scripts/rcc-one.sh runs it per commit instead;
      # the action's other step is macOS-only.

      # What the `regen` gate of scripts/rcc-one.sh runs.
      # Makefile-cigraph builds a Python virtualenv for Stimulus,
      # and regenerates the lexers and parsers with the host's flex and bison (`DOCKER=`).
      # `EACH_VENV_DIR`, read by that gate, keeps the virtualenvs outside the workspace,
      # which each-shard wipes per commit, keyed on their sources, so a shard builds each once.
      - name: Install the tools that regenerate the R/C interface
        run: |
          ## -- Install the tools that regenerate the R/C interface --
          echo "EACH_VENV_DIR=${RUNNER_TEMP}/each-venv" | tee -a "${GITHUB_ENV}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison python3-venv
          flex --version
          bison --version | head -n 1
          python3 --version
        shell: bash

      # Run for its tool installation only (air, and clang-format should rigraph ever configure it):
      # each-shard resets the workspace before every commit.
      - uses: cynkra/cynkratemplate/.github/actions/style@main

      - uses: cynkra/cynkratemplate/.github/actions/each-shard@claude/each-actions
        with:
          shard: ${{ matrix.shard }}
          token: ${{ secrets.GITHUB_TOKEN }}
          deadline-minutes: ${{ env.EACH_SHARD_BUDGET_MINUTES }}
          summary-tail: ${{ vars.EACH_RCC_SUMMARY_TAIL }}
          # R compiles with -g, and with -g ccache hashes the working directory by default.
          # `R CMD build` installs the package from a fresh temporary directory to build the vignettes,
          # so without this that build misses on every commit.
          ccache-hash-dir: false

  # A leg that reaches its deadline defers the commits it did not get to,
  # and nothing else would plan them before the next push.
  # `!cancelled()`, so that a leg that failed or timed out is followed up, while a cancelled run stays retired.
  follow-up:
    needs:
      - plan
      - build

    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '0' }}

    runs-on: ubuntu-26.04

    timeout-minutes: 10

    name: "Follow up on undecided commits"

    permissions:
      contents: read
      # Dispatches the follow-up, and lists the runs already waiting on the branch.
      actions: write

    steps:
      # The scripts of the commit this run's workflow was read from, not the branch:
      # a branch that moved or was deleted since must reach the script's "moved" exit rather than fail the checkout.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          # Holds `scripts-dir` of the each-follow-up action, `scripts` by default.
          sparse-checkout: scripts
          filter: blob:none

      - uses: cynkra/cynkratemplate/.github/actions/each-follow-up@claude/each-actions
        with:
          inputs: ${{ toJSON(inputs) }}
          # The file of this workflow: the dispatch target, also when it is reached through `workflow_call`.
          workflow: each.yaml
