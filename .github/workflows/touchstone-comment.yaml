name: Continuous Benchmarks (Comment)

concurrency:
  # `github.head_ref` is empty for `workflow_run` events,
  # which put every PR into one shared group,
  # so a comment job for one PR cancelled the one for another.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Continuous Benchmarks (Receive)"]
    types:
      - completed

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    # Require the receive run to have actually succeeded. Without the
    # conclusion check this job also runs when receive was skipped/failed, then
    # crashes downloading the missing "pr" artifact ("Cannot read properties of
    # undefined (reading 'id')").
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Pinned to the head of lorenzwalthert/touchstone#174 (maelle/touchstone,
      # branch `comment`), which updates a single PR comment instead of posting
      # a new one per commit. It is based on a default-branch commit that already
      # uses artifact@v4/v5 and github-script@v7 (the released tags v1/v1.0.1
      # still use artifact@v2, which GitHub auto-fails). Switch back to
      # lorenzwalthert/touchstone once #174 is merged and released.
      - uses: maelle/touchstone/actions/comment@cbc9c2ea30f2f10c5455a2d04bdec9da7c259e40
        with: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
