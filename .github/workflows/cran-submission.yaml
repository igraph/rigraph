# Tags the commit and submits the package to CRAN.
#
# The `tag` job tags the commit as `v<version>`,
# with the NEWS.md section of that version as the message, like the tags fledge creates.
# An existing tag of that name is printed and then moved to this commit.
#
# The `cran-submission` job then runs coatless-actions/cran-submission:
# an R CMD check on Linux, an upload of the checked tarball and cran-comments.md
# through CRAN's submission form, and an issue that tracks the submission.
# CRAN mails a confirmation link to the maintainer in DESCRIPTION,
# and the submission only counts once that link has been followed.
#
# Only a run started by hand tags and submits,
# and only with the input `confirmation` set to CONFIRM.
# The push trigger does not tag or submit anything:
# it lets GitHub see this workflow on a `cran-*` branch, so that it can be run from there
# before it exists on the default branch, and its jobs are skipped.
on:
  push:
    branches:
      - cran-*
    paths:
      - .github/workflows/cran-submission.yaml
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "CONFIRM" to submit this branch to CRAN'
        type: string
        required: true
        default: ""

name: CRAN submission

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A job of its own, so that the token that can push the tag
  # is never available to the steps that build and check the package.
  tag:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: "Tag the commit"

    permissions:
      contents: write

    steps:
      # The same commit as the submission: both jobs check out `github.sha`.
      - uses: actions/checkout@v6

      - name: Check the confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "CONFIRM" ]; then
            echo "::error::Set the input 'confirmation' to CONFIRM to tag and submit."
            exit 1
          fi
        shell: bash

      - name: Configure the Git identity
        uses: cynkra/cynkratemplate/.github/actions/git-identity@main

      - name: Create and push the tag
        run: |
          pkg_name="$(sed -n 's/^Package: *//p' DESCRIPTION)"
          pkg_version="$(sed -n 's/^Version: *//p' DESCRIPTION)"
          tag="v$pkg_version"

          message="$RUNNER_TEMP/tag-message.md"
          # The section from the version's heading to the next one, without the leading "# ".
          awk -v heading="# $pkg_name $pkg_version" '
            $0 == heading { found = 1; print substr($0, 3); next }
            found && /^# / { exit }
            found { print }
          ' NEWS.md > "$message"
          if [ ! -s "$message" ]; then
            echo "::error::NEWS.md has no section for $pkg_name $pkg_version."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            echo "::warning::Moving the existing tag $tag, which points to $(git rev-parse "$tag^{commit}")."
            echo "::group::Existing tag $tag"
            git cat-file -p "$tag"
            echo "::endgroup::"
          fi

          # The default cleanup would drop the "## ..." subheadings as comment lines.
          git tag -a -f "$tag" --cleanup=whitespace -F "$message"
          git push --force origin "refs/tags/$tag"
          echo "Tagged $(git rev-parse HEAD) as $tag." | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  cran-submission:
    needs: tag

    runs-on: ubuntu-latest
    timeout-minutes: 120

    name: "Submit to CRAN"

    permissions:
      contents: read
      # The action opens an issue that tracks the submission.
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check and submit the package
        # v1.0.3, pinned: this step uploads to CRAN.
        uses: coatless-actions/cran-submission@0224a35fffe0afcac8392b2520d966537866da83
        with:
          confirmation: ${{ inputs.confirmation }}
          error-on: warning
          create-issue: true
