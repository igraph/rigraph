# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - cran-*
      - claude/**
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.sha }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

name: R-CMD-check-extra

jobs:
  sanitizer:
    runs-on: ubuntu-22.04

    name: Sanitizer

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: apt update
        run: |
          sudo apt-get update
          sudo apt-get install -y libarpack2-dev
        shell: bash

      - name: run sanitizer
        uses: addnab/docker-run-action@v3
        with:
          # Built daily from https://github.com/cynkra/r-debug, so R-devel is
          # at most a day old.
          # The images under ghcr.io/cynkra/docker-images are no longer
          # rebuilt; their R-devel is stale.
          image: ghcr.io/cynkra/r-debug/r-debug-csan-igraph:latest
          options: --rm --platform linux/amd64 -v ${{ github.workspace }}:/rigraph
          run: |
            set -e
            printenv
            cd rigraph
            RDcsan CMD INSTALL . --no-byte-compile
            CI=true R_SANITIZER=true RDcsan -q -e 'testthat::test_local(reporter = c("location", "summary"), load_package = "installed")'
