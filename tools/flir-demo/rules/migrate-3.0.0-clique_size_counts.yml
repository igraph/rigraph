id: igraph-3.0.0-clique_size_counts-min
language: r
severity: warning
rule:
  kind: argument
  has: { field: value, pattern: $V }
  any:
    - # passed by name
      has: { field: name, kind: identifier, regex: '^(mi)$' }
      inside:
        kind: arguments
        inside:
          kind: call
          has: { field: function, regex: '^(igraph:::?)?clique_size_counts$' }
    - # passed by position
      not: { has: { field: name, kind: identifier } }
      nthChild: { position: 2, ofRule: { kind: argument, not: { has: { field: name, kind: identifier } } } }
      inside:
        kind: arguments
        not:
          any:
            - has: { kind: comma, follows: { kind: comma } }
            - has: { kind: comma, follows: { regex: '^\($' } }
            - has: { kind: comma, precedes: { regex: '^\)$' } }
            - has: { kind: argument, has: { kind: dots } }
            - has: { kind: argument, has: { field: name, regex: '^(g|gr|gra|grap|graph|m|mi|min)$' } }
        inside:
          kind: call
          has: { field: function, regex: '^(igraph:::?)?clique_size_counts$' }
          not:
            inside:
              kind: binary_operator
              field: rhs
              has: { field: operator, regex: '^(\|>|%>%)$' }
              not: { has: { field: rhs, kind: call, has: { kind: arguments, has: { kind: argument, has: { field: value, kind: identifier, regex: '^[.]$' } } } } }
    - # passed by position after a pipe
      not: { has: { field: name, kind: identifier } }
      nthChild: { position: 1, ofRule: { kind: argument, not: { has: { field: name, kind: identifier } } } }
      inside:
        kind: arguments
