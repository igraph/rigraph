            - has: { kind: argument, has: { field: name, regex: '^(g|gr|gra|grap|graph|m|mi|min)$' } }
        inside:
          kind: call
          has: { field: function, regex: '^(igraph:::?)?clique_size_counts$' }
          inside:
            kind: binary_operator
            field: rhs
            has: { field: operator, regex: '^(\|>|%>%)$' }
